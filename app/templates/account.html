{% extends "base.html" %}
{% block title %}My account · Afterpause{% endblock %}
{% block content %}
<section class="shell section narrow">
  <p class="eyebrow">Your Afterpause account</p>
  <h1>Hello, {{ g.user.display_name }}.</h1>
  <p>Signed in as <strong>{{ g.user.email }}</strong>.</p>
  <div class="actions">
    <a class="button" href="{{ url_for('exhibits.dashboard') }}">Open dashboard</a>
    <a href="{{ url_for('auth.profile') }}">Edit profile</a>
  </div>
</section>
{% endblock %}
