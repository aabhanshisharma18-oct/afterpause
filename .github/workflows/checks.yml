name: Museum checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: local_ci_root_only
          MYSQL_DATABASE: afterpause_test
          MYSQL_USER: afterpause
          MYSQL_PASSWORD: local_ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: MySQL lifecycle and row-lock checks
        run: python -m pytest -q
        env:
          TEST_DATABASE_URL: mysql+pymysql://afterpause:local_ci_only@127.0.0.1:3306/afterpause_test?charset=utf8mb4

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate production startup script
        run: sh -n scripts/start-production.sh
      - name: Build production image
        run: docker build --tag afterpause:check .
      - name: Reject missing production configuration
        run: |
          if docker run --rm afterpause:check; then
            echo "Production container unexpectedly started without secrets"
            exit 1
          fi
